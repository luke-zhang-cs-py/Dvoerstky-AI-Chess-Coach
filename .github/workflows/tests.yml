name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 on 19 October
    # 2026, and a runner image changing under the job is a failure with no
    # code change behind it. Move this on purpose, after a green run.
    runs-on: ubuntu-24.04
    # Well past what this job takes; a stuck run fails here instead of
    # after GitHub's six-hour default.
    timeout-minutes: 30
    env:
      TZ: America/Toronto   # the plan tests step across a real clock change
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node suites (perft, rules, engine, analysis, sparring, integration, regressions, titled, coach, app)
        run: |
          for t in test/*.js; do
            # tactics.js scores by the clock, so its number depends on the machine: run it by hand
            # (as tools/bench.js and tools/acpl.js, the speed and sparring-calibration measurements)
            case "$t" in test/tactics.js) continue ;; esac
            echo "::group::$t"
            node "$t" || exit 1
            echo "::endgroup::"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Engine over UCI (1,000-position legality, mates, games against baselines)
        run: |
          pip install chess==1.11.2
          # every reply legal, and within 100 ms a move + 150 ms of slack for a shared runner
          python test/engine_gauntlet.py legality --movetime 100 --slack 150
          # 1 s a move (about 5 minutes for the 200 positions): 100 of 100 for both here. At 300 ms
          # mate in 2 fell to 82 on a busy machine, too close to any floor to gate on. 95 leaves
          # room for a runner at half this speed, where 95-97 have been seen.
          python test/engine_gauntlet.py mates --movetime 1000 --min-mate1 100 --min-mate2 95
          python test/engine_gauntlet.py random --games 20

      - name: Browser checks (index.html in Chromium, Stockfish included)
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python test/ui_check.py

      - name: Single-file build (dist/ is not in git; built here and opened on its own)
        run: |
          python tools/build_single_file.py
          python test/dist_check.py
